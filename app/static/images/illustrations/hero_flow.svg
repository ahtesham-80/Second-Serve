<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 460" width="100%" height="100%" fill="none">
  <defs>
    <linearGradient id="redGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF0000"/>
      <stop offset="100%" stop-color="#CC0000"/>
    </linearGradient>
    <linearGradient id="softBlush" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF5F5"/>
      <stop offset="100%" stop-color="#FFE8E8"/>
    </linearGradient>
    <filter id="cardShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#000000" flood-opacity="0.06"/>
    </filter>
  </defs>

  <!-- Connecting dashed flow curves -->
  <path d="M 230 210 C 310 170, 310 210, 340 210" stroke="#FF0000" stroke-width="2.5" stroke-dasharray="6 6" opacity="0.6"/>
  <path d="M 460 210 C 500 210, 520 170, 570 210" stroke="#FF0000" stroke-width="2.5" stroke-dasharray="6 6" opacity="0.6"/>

  <!-- Left Node: Food Donors Card -->
  <g transform="translate(40, 110)" filter="url(#cardShadow)">
    <rect width="200" height="200" rx="14" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1.5"/>
    <rect width="200" height="6" rx="3" fill="#FF0000"/>
    <circle cx="100" cy="60" r="30" fill="#FFF1F1"/>
    <circle cx="100" cy="60" r="14" stroke="#FF0000" stroke-width="2" fill="none"/>
    <path d="M 96 52 L 104 68 M 104 52 L 96 68" stroke="#FF0000" stroke-width="2" stroke-linecap="round"/>
    <text x="100" y="118" font-family="'Inter', sans-serif" font-size="16" font-weight="700" fill="#111827" text-anchor="middle">Food Donors</text>
    <text x="100" y="140" font-family="'Inter', sans-serif" font-size="12" fill="#6B7280" text-anchor="middle">Hotels, Caterers, Canteens</text>
    <rect x="35" y="156" width="130" height="26" rx="13" fill="#FFF1F1"/>
    <text x="100" y="173" font-family="'Inter', sans-serif" font-size="11" font-weight="700" fill="#FF0000" text-anchor="middle">Instant Surplus Post</text>
  </g>

  <!-- Central Node: Deterministic Matching Core -->
  <g transform="translate(290, 80)" filter="url(#cardShadow)">
    <rect width="220" height="260" rx="16" fill="#FFFFFF" stroke="#FF0000" stroke-width="2"/>
    <rect width="220" height="8" rx="4" fill="url(#redGrad)"/>
    
    <circle cx="110" cy="65" r="32" fill="url(#redGrad)"/>
    <!-- Zap Spark Icon -->
    <path d="M 112 48 L 101 65 L 110 65 L 108 82 L 121 62 L 112 62 Z" fill="#FFFFFF"/>
    
    <text x="110" y="125" font-family="'Inter', sans-serif" font-size="16" font-weight="800" fill="#111827" text-anchor="middle">Smart Matching</text>
    <text x="110" y="144" font-family="'Inter', sans-serif" font-size="12" fill="#FF0000" font-weight="700" text-anchor="middle">Deterministic Formula</text>

    <!-- Factor Breakdown Mini Grid -->
    <g transform="translate(20, 160)">
      <rect width="85" height="26" rx="6" fill="#FFF1F1"/>
      <text x="42" y="17" font-family="'Inter', sans-serif" font-size="10.5" font-weight="700" fill="#FF0000" text-anchor="middle">Category 40%</text>
      
      <rect x=\"95\" x="95" width="85" height="26" rx="6" fill="#F9FAFB" stroke="#E5E7EB"/>
      <text x="137" y="17" font-family="'Inter', sans-serif" font-size="10.5" font-weight="600" fill="#374151" text-anchor="middle">Location 25%</text>

      <rect y="34" width="85" height="26" rx="6" fill="#F9FAFB" stroke="#E5E7EB"/>
      <text x="42" y="51" font-family="'Inter', sans-serif" font-size="10.5" font-weight="600" fill="#374151" text-anchor="middle">Quantity 20%</text>

      <rect x="95" y="34" width="85" height="26" rx="6" fill="#FFF1F1"/>
      <text x="137" y="51" font-family="'Inter', sans-serif" font-size="10.5" font-weight="700" fill="#FF0000" text-anchor="middle">Urgency 15%</text>
    </g>

    <rect x="30" y="235" width="160" height="6" rx="3" fill="#F3F4F6"/>
    <rect x="30" y="235" width="150" height="6" rx="3" fill="#FF0000"/>
  </g>

  <!-- Right Node: Verified NGOs -->
  <g transform="translate(560, 110)" filter="url(#cardShadow)">
    <rect width="200" height="200" rx="14" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1.5"/>
    <rect width="200" height="6" rx="3" fill="#FF0000"/>
    <circle cx="100" cy="60" r="30" fill="#ECFDF5"/>
    <!-- Heart Icon -->
    <path d="M 100 68 C 88 56, 83 48, 91 43 C 96 40, 99 44, 100 45 C 101 44, 104 40, 109 43 C 117 48, 112 56, 100 68 Z" fill="#10B981"/>
    <text x="100" y="118" font-family="'Inter', sans-serif" font-size="16" font-weight="700" fill="#111827" text-anchor="middle">Verified NGOs</text>
    <text x="100" y="140" font-family="'Inter', sans-serif" font-size="12" fill="#6B7280" text-anchor="middle">Shelters &amp; Soup Kitchens</text>
    <rect x="35" y="156" width="130" height="26" rx="13" fill="#ECFDF5"/>
    <text x="100" y="173" font-family="'Inter', sans-serif" font-size="11" font-weight="700" fill="#065F46" text-anchor="middle">Zero-Conflict Claim</text>
  </g>

  <!-- Floating Feature Chips at Bottom -->
  <g transform="translate(140, 380)" filter="url(#cardShadow)">
    <rect width="240" height="54" rx="12" fill="#FFFFFF" stroke="#E5E7EB"/>
    <circle cx="32" cy="27" r="14" fill="#ECFDF5"/>
    <circle cx="32" cy="27" r="6" fill="#10B981"/>
    <text x="58" y="24" font-family="'Inter', sans-serif" font-size="13" font-weight="700" fill="#111827">Instant Claim Lock</text>
    <text x="58" y="42" font-family="'Inter', sans-serif" font-size="11.5" fill="#6B7280">Prevents multiple NGO conflicts</text>
  </g>

  <g transform="translate(420, 380)" filter="url(#cardShadow)">
    <rect width="250" height="54" rx="12" fill="#FFFFFF" stroke="#E5E7EB"/>
    <circle cx="32" cy="27" r="14" fill="#FFF1F1"/>
    <circle cx="32" cy="27" r="6" fill="#FF0000"/>
    <text x="58" y="24" font-family="'Inter', sans-serif" font-size="13" font-weight="700" fill="#111827">4-Step Collection Stepper</text>
    <text x="58" y="42" font-family="'Inter', sans-serif" font-size="11.5" fill="#6B7280">Real-time status updates</text>
  </g>
</svg>